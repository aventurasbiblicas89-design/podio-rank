<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas da Shopee</title>
<style>
  :root { --bg:#faf7f2; --ink:#1d1b18; --mute:#6f6a62; --card:#fff; --acc:#ee4d2d; --line:#e6e0d6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:24px 16px 8px; max-width:1000px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  #att { color:var(--mute); font-size:.9rem; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; text-decoration:none; color:inherit; }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; background:#eee; }
  .info { padding:10px 12px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .nome { font-size:.9rem; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .preco { font-weight:700; font-size:1.15rem; }
  .desc { align-self:flex-start; background:var(--acc); color:#fff; font-size:.78rem; font-weight:700; padding:2px 8px; border-radius:20px; }
  .btn { margin-top:auto; text-align:center; background:var(--ink); color:#fff; padding:9px; border-radius:8px; font-size:.9rem; }
  .card:focus-visible { outline:3px solid var(--acc); }
  #msg { padding:32px 16px; text-align:center; color:var(--mute); grid-column:1/-1; }
  footer { max-width:1000px; margin:0 auto; padding:8px 16px 32px; color:var(--mute); font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>Ofertas da Shopee</h1>
  <div id="att">Carregando…</div>
</header>
<main id="grid"><div id="msg">Buscando ofertas…</div></main>
<footer>Preços e disponibilidade podem mudar na Shopee. Este site recebe comissão por compras feitas pelos links.</footer>
<script>
(async function () {
  var grid = document.getElementById('grid');
  var att = document.getElementById('att');
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  try {
    var r = await fetch('/api/ofertas');
    var d = await r.json();
    grid.innerHTML = '';
    if (!d.lista || !d.lista.length) { var m = el('div', null, 'Ainda não há ofertas. Volte em breve.'); m.id = 'msg'; grid.appendChild(m); att.textContent = ''; return; }
    att.textContent = 'Atualizado em ' + new Date(d.atualizadoEm).toLocaleString('pt-BR');
    d.lista.forEach(function (p) {
      if (!/^https:\/\//.test(p.link || '')) return;
      var a = el('a', 'card'); a.href = p.link; a.target = '_blank'; a.rel = 'nofollow sponsored noopener';
      var img = el('img'); img.loading = 'lazy'; img.alt = p.nome || ''; if (/^https:\/\//.test(p.imagem || '')) img.src = p.imagem;
      var info = el('div', 'info');
      info.appendChild(el('span', 'desc', '-' + Math.round(p.desconto) + '%'));
      info.appendChild(el('div', 'nome', p.nome));
      info.appendChild(el('div', 'preco', 'R$ ' + Number(p.preco).toLocaleString('pt-BR', { minimumFractionDigits: 2 })));
      info.appendChild(el('div', 'btn', 'Ver na Shopee'));
      a.appendChild(img); a.appendChild(info); grid.appendChild(a);
    });
  } catch (e) {
    grid.innerHTML = ''; var m2 = el('div', null, 'Não foi possível carregar as ofertas agora.'); m2.id = 'msg'; grid.appendChild(m2);
  }
})();
</script>
</body>
</html>
