<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obrigado! Baixe seu e-book</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16203A;color:#F3EFE4;font:17px/1.55 system-ui,sans-serif;padding:24px;text-align:center}
main{max-width:420px}
h1{font:600 28px/1.2 "Iowan Old Style",Palatino,Georgia,serif;margin:0 0 12px}
a.btn{display:block;margin-top:22px;padding:16px;border-radius:12px;background:#D4A843;color:#16203A;font-weight:700;text-decoration:none;font-size:18px}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{display:block;margin-top:18px;opacity:.75}
</style></head><body><main id="m">
<h1>Obrigado pela compra!</h1>
<p>Toque no botão para baixar seu e-book. Se o pagamento foi por Pix e ainda não foi confirmado, o link também chega no seu e-mail assim que aprovar.</p>
<a class="btn" id="dl" href="#">Baixar meu e-book</a>
<small>Gracias por tu compra. Si elegiste la versión en español, el botón descarga tu archivo.</small>
</main>
<script>
var q=new URLSearchParams(location.search),id=q.get("payment_id")||q.get("collection_id");
var b=document.getElementById("dl");
if(id){b.href="/api/ebook?acao=download&payment_id="+encodeURIComponent(id)}
else{b.style.display="none"}
</script></body></html>
