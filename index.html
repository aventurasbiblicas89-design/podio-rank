<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podio Rank - 41.281 visitas/dia - Compre seu lugar no Topo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#FFFBF7}
</style>
</head>
<body class="antialiased">
<div class="max-w-[700px] mx-auto px-4 pt-6 pb-24">

<!-- HEADER -->
<h1 class="font-black text-[42px] leading-[0.9] text-center tracking-[-2px]">Compre seu<br>lugar no Topo</h1>
<p class="text-center text-[13px] mt-3 font-bold text-zinc-500">41.281 visitas/dia • Topo fixo no podiorank.com.br</p>

<!-- TOP 10 -->
<div class="bg-white border-[2.5px] border-black rounded-[32px] p-5 mt-7 shadow-[6px_6px_0px_0px_#000]">
<div class="flex justify-between items-center mb-4">
<h2 class="font-black text-[20px]">🏆 TOP 10 - Diário</h2>
<span class="bg-red-500 text-white text-[10px] font-black px-3 py-1 rounded-full animate-pulse">AO VIVO AGORA</span>
</div>
<div id="top10"></div>
</div>

<!-- CATEGORIAS -->
<div class="mt-10">
<h2 class="font-black text-[26px] tracking-[-1px]">Categorias Premium</h2>
<p class="text-[12px] font-bold text-zinc-500 -mt-1">15 categorias x 150 posições = 2.250 lugares pra vender</p>
<div id="cats" class="mt-5"></div>
</div>

</div>

<script>
const TOP10=[
 {p:1,nome:"Além dos Versículos - 355K",link:"https://www.facebook.com/share/1C9k3ZA1pG/",valor:3129.00,avatar:"📖"},
 {p:2,nome:"Rupert Marketing - 48K",link:"https://www.facebook.com/share/19T6y57XuF/",valor:2399.00,avatar:"🚀"},
 {p:3,nome:"PEDRO Automação - YouTube",link:"https://youtube.com/@meme-zinho?si=VnRDBaijlDCtGv0e",valor:1299.00,avatar:"🤖"},
 {p:4,nome:"VAGA LIVRE",link:"",valor:999.00,livre:true},
 {p:5,nome:"VAGA LIVRE",link:"",valor:799.00,livre:true},
 {p:6,nome:"VAGA LIVRE",link:"",valor:499.00,livre:true},
 {p:7,nome:"VAGA LIVRE",link:"",valor:299.00,livre:true},
 {p:8,nome:"VAGA LIVRE",link:"",valor:199.00,livre:true},
 {p:9,nome:"VAGA LIVRE",link:"",valor:149.00,livre:true},
 {p:10,nome:"VAGA LIVRE",link:"",valor:99.00,livre:true},
];

function getPrice(pos){
 if(pos==1) return 3129;
 if(pos==2) return 2399;
 if(pos==3) return 1299;
 if(pos==4) return 999;
 if(pos==5) return 799;
 if(pos==6) return 499;
 if(pos==7) return 299;
 if(pos==8) return 199;
 if(pos==9) return 149;
 if(pos==10) return 99;
 if(pos<=20) return 79;
 if(pos<=50) return 39;
 if(pos<=100) return 19;
 return 1;
}

const topDiv = document.getElementById('top10');
topDiv.innerHTML = TOP10.map(t=>`
<div class="flex justify-between items-center py-4 border-b border-zinc-100 last:border-0">
<div class="flex gap-3 items-center min-w-0">
<div class="w-12 h-12 ${t.p==1?'bg-black text-white':'bg-zinc-100 text-black'} rounded-[14px] flex items-center justify-center font-black text-[14px] shrink-0">#${t.p}</div>
<div class="min-w-0">
${t.livre?`<p class="font-black text-[13px] truncate">VAGA LIVRE</p>`:`<a href="${t.link}" target="_blank" class="font-black text-[13px] hover:underline line-clamp-1">${t.avatar} ${t.nome} ↗</a>`}
<p class="text-[11px] font-bold text-zinc-500">R$ ${t.valor.toFixed(2).replace('.',',')} ${t.p<=3?'• AO VIVO':''}</p>
</div>
</div>
<button onclick="pagar('TOPO #${t.p}',${t.valor})" class="bg-black text-white px-5 py-2.5 rounded-full font-black text-[11px] shrink-0 hover:bg-zinc-800">${t.livre?'PEGAR #'+t.p:'TOMAR'}</button>
</div>
`).join('');

const CATEGORIAS=["📈 MARKETING","⚖️ ADVOGADOS","🩺 MÉDICOS","🛒 MERCADO","📦 ECOM","▶️ YOUTUBE","📘 FACEBOOK","📸 INSTAGRAM","🐦 X / TWITTER","🎨 DESIGN","💰 FINANÇAS","🔍 SEO","🎯 TRÁFEGO","📚 INFOPRODUTO","💎 PLR"];

document.getElementById('cats').innerHTML=CATEGORIAS.map((cat,idx)=>`
<div class="bg-white border-[2px] border-black rounded-[28px] p-5 mb-5 shadow-[4px_4px_0px_0px_#000]">
<div class="flex justify-between items-center">
<p class="font-black text-[15px]">${cat}</p>
<span class="text-[9px] font-black bg-black text-white px-3 py-1 rounded-full">150 VAGAS • R$ 1 a R$ 3.129</span>
</div>
<div id="cat-${idx}" class="mt-4"></div>
<button onclick="expandir(${idx})" id="btn-${idx}" class="w-full mt-3 bg-[#FFFBF7] border border-black rounded-full py-3 text-[11px] font-black hover:bg-black hover:text-white transition">Ver todas 150 posições ↓</button>
</div>`).join('');

function renderCat(idx, limite=3){
 let html='';
 for(let i=1;i<=limite;i++){
  let preco=getPrice(i);
  html+=`<div class="flex justify-between items-center bg-[#FFFBF7] border border-zinc-200 rounded-full px-3.5 py-3 mb-2">
  <div class="flex items-center gap-2 min-w-0">
  <div class="w-7 h-7 bg-black text-white rounded-full flex items-center justify-center font-black text-[10px] shrink-0">#${i}</div>
  <span class="font-black text-[11px]">VAGA LIVRE</span>
  <span class="text-[10px] font-bold text-zinc-400">· R$ ${preco}</span>
  </div>
  <button onclick="pagar('${CATEGORIAS[idx]} #${i}',${preco})" class="bg-black text-white px-4 py-2 rounded-full text-[10px] font-black shrink-0">PEGAR →</button>
  </div>`;
 }
 document.getElementById(`cat-${idx}`).innerHTML=html;
}
CATEGORIAS.forEach((_,i)=>renderCat(i,3));

function expandir(idx){
 const btn=document.getElementById(`btn-${idx}`);
 if(btn.innerText.includes('150')){
  renderCat(idx,150);
  btn.innerText='Mostrar menos ↑';
 }else{
  renderCat(idx,3);
  btn.innerText='Ver todas 150 posições ↓';
  document.getElementById(`cat-${idx}`).scrollIntoView({behavior:'smooth', block:'center'});
 }
}

async function pagar(pos,valor){
 const nome=prompt('Seu NOME que vai aparecer no Topo:');
 if(!nome) return;
 const link=prompt('Seu LINK (https://):');
 if(!link) return;
 if(!link.startsWith('http')){ alert('Link precisa começar com https://'); return; }
 try{
  const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({posicao:pos+' - '+nome,valor,link,nomeEmpresa:nome})});
  const d=await r.json();
  if(d.url||d.init_point){ location.href=d.url||d.init_point; }
  else{ alert('Erro no checkout: '+(d.error||'tente de novo')); }
 }catch(e){ alert('Erro API - verifica /api/checkout'); }
}
</script>
</body>
</html>
