<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAPY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FF5DA2; --bg2:#7C3AED; --bg3:#3B82F6;
  --sand:#FFF3D6; --water:#3ED0D0;
  --capy:#B98045; --capy-dark:#8C5E2E; --capy-light:#E0AE73;
  --gold:#FFC93C; --pink:#FF6FA5; --lime:#B6F23C; --sky:#5FD9FF;
  --text:#2B1046; --muted:#6E5A96;
  --card:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(circle at 15% 8%, rgba(255,255,255,.35), transparent 40%),
    linear-gradient(160deg,var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
  color:var(--text);
  font-family:'Nunito',system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  min-height:100%; padding:16px;
}
.app{width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px}
.topbar{display:flex; justify-content:space-between; align-items:center}
.brand{font-family:'Baloo 2',sans-serif; font-size:26px; font-weight:800; letter-spacing:.3px; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.15)}
.brand span{color:var(--gold); filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.currency{display:flex; gap:8px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px}
.chip{background:#fff; border-radius:999px; padding:6px 14px; display:flex; align-items:center; gap:6px; box-shadow:0 4px 0 rgba(0,0,0,.15)}
.chip.gold{color:#B8790A}
.chip.xp{color:#5B3DBF}

.stage{
  background:
    radial-gradient(circle at 78% 14%, #FFE58A 0%, rgba(255,229,138,0) 22%),
    linear-gradient(180deg,#6FE3E0 0%, #3ED0D0 55%, #1CA7C4 100%);
  border-radius:28px; padding:22px 16px 12px; position:relative; overflow:hidden;
  min-height:270px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  box-shadow:0 10px 0 rgba(0,0,0,.12), inset 0 0 0 4px rgba(255,255,255,.5);
}
.sun{position:absolute; top:-18px; right:-18px; width:90px; height:90px; border-radius:50%;
  background:radial-gradient(circle, #FFE47A 0%, #FFC93C 70%, rgba(255,201,60,0) 75%);}
.sparkle{position:absolute; font-size:16px; opacity:.9; animation:twinkle 2.4s ease-in-out infinite}
.sparkle.s1{top:16%; left:12%; animation-delay:.2s}
.sparkle.s2{top:28%; right:20%; animation-delay:1s}
.sparkle.s3{top:10%; left:45%; animation-delay:1.7s}
@keyframes twinkle{0%,100%{opacity:.3; transform:scale(.8)}50%{opacity:1; transform:scale(1.15)}}
.mission{
  position:absolute; top:10px; left:10px; right:10px;
  background:#fff; color:var(--text); border-radius:16px; padding:9px 13px;
  font-weight:700; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; gap:8px;
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.mission b{color:#B8790A}
.pond{position:absolute; bottom:0; left:0; right:0; height:76px; background:linear-gradient(180deg, rgba(28,167,196,0) 0%, #1493B2 90%); opacity:.95}

#capy{cursor:pointer; transform-origin:center bottom; transition:transform .15s}
#capy.bounce{animation:bounce .5s ease}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.08,.92)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
.mood-label{font-size:13px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.2); margin-top:6px; text-align:center; min-height:16px}

.stats{display:flex; flex-direction:column; gap:11px; background:var(--card); border-radius:20px; padding:16px; box-shadow:0 6px 0 rgba(0,0,0,.1)}
.stat{display:flex; align-items:center; gap:10px}
.stat .icon{width:24px; text-align:center; font-size:18px}
.bar{flex:1; height:11px; background:#F1ECFB; border-radius:99px; overflow:hidden}
.bar > i{display:block; height:100%; border-radius:99px; transition:width .4s ease}
.bar.fome > i{background:linear-gradient(90deg,#FF6FA5,#FF9776)}
.bar.energia > i{background:linear-gradient(90deg,#FFC93C,#FFE47A)}
.bar.humor > i{background:linear-gradient(90deg,#3ED0D0,#B6F23C)}

.actions{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.actions button{
  background:#fff; color:var(--text); border:none; border-radius:18px;
  padding:13px 4px; font-size:12.5px; font-weight:800; font-family:'Baloo 2',sans-serif; display:flex; flex-direction:column; align-items:center; gap:5px;
  cursor:pointer; transition:transform .12s; box-shadow:0 5px 0 rgba(0,0,0,.12);
}
.actions button:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.12)}
.actions button:disabled{opacity:.35; cursor:not-allowed}
.actions button .em{font-size:22px}

.section-title{font-family:'Baloo 2',sans-serif; font-size:15px; font-weight:800; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.15); margin:2px 2px -4px}
.shop{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.item{background:#fff; border-radius:18px; padding:11px; text-align:center; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.1); transition:transform .12s}
.item:active{transform:translateY(3px)}
.item .em{font-size:26px}
.item .name{font-size:11.5px; font-weight:800; margin-top:4px}
.item .price{font-size:11px; color:#B8790A; font-weight:800; margin-top:2px}
.item.disabled{opacity:.45; cursor:not-allowed}

.game-card{background:var(--card); border-radius:20px; padding:16px; text-align:center; box-shadow:0 6px 0 rgba(0,0,0,.1)}
.game-card button{
  margin-top:10px; background:linear-gradient(90deg,var(--pink),var(--gold)); color:#2B1046; border:none; border-radius:99px;
  padding:11px 22px; font-weight:800; font-family:'Baloo 2',sans-serif; font-size:14px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.15);
}
.game-card button:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15)}
#gameArea{position:relative; height:180px; background:linear-gradient(180deg,#EAF7FF,#CDEBFF); border-radius:16px; margin-top:10px; overflow:hidden; display:none}
.fruit{position:absolute; font-size:28px; cursor:pointer; user-select:none}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:linear-gradient(90deg,var(--pink),#FF9776); color:#fff; padding:11px 20px; border-radius:99px;
  font-family:'Baloo 2',sans-serif; font-size:13.5px; font-weight:700; box-shadow:0 6px 16px rgba(0,0,0,.25);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px)}

@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#1F3B32; --bg2:#274A3E;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">CAPY <span>🐹</span></div>
    <div class="currency">
      <div class="chip gold">🪙 <span id="coins">0</span></div>
      <div class="chip xp">⭐ Nv <span id="level">1</span></div>
    </div>
  </div>

  <div class="stage">
    <div class="sun"></div>
    <div class="sparkle s1">✨</div>
    <div class="sparkle s2">✨</div>
    <div class="sparkle s3">⭐</div>
    <div class="mission" id="missionBar">Carregando missão…</div>
    <svg id="capy" width="150" height="120" viewBox="0 0 150 120" onclick="petCapy()">
      <ellipse cx="75" cy="95" rx="55" ry="10" fill="rgba(0,0,0,.25)"/>
      <ellipse cx="75" cy="70" rx="58" ry="38" fill="#9A7B52"/>
      <ellipse cx="75" cy="80" rx="50" ry="26" fill="#7A5F3E"/>
      <ellipse cx="40" cy="55" rx="24" ry="20" fill="#9A7B52"/>
      <ellipse cx="20" cy="46" rx="6" ry="9" fill="#7A5F3E"/>
      <ellipse cx="55" cy="46" rx="6" ry="9" fill="#7A5F3E"/>
      <circle id="eyeL" cx="30" cy="52" r="3.4" fill="#241C10"/>
      <circle id="eyeR" cx="48" cy="52" r="3.4" fill="#241C10"/>
      <ellipse cx="24" cy="63" rx="4" ry="3" fill="#241C10"/>
      <path id="mouth" d="M20 68 Q24 71 28 68" stroke="#241C10" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="mood-label" id="moodLabel">A capivara está tranquila.</div>
    <div class="pond"></div>
  </div>

  <div class="stats">
    <div class="stat"><span class="icon">🍉</span><div class="bar fome"><i id="barFome"></i></div></div>
    <div class="stat"><span class="icon">⚡</span><div class="bar energia"><i id="barEnergia"></i></div></div>
    <div class="stat"><span class="icon">😊</span><div class="bar humor"><i id="barHumor"></i></div></div>
  </div>

  <div class="actions">
    <button onclick="doAction('alimentar')"><span class="em">🍉</span>Alimentar</button>
    <button onclick="doAction('brincar')"><span class="em">🎾</span>Brincar</button>
    <button onclick="doAction('banho')"><span class="em">💧</span>Banho</button>
    <button onclick="doAction('dormir')"><span class="em">💤</span>Dormir</button>
  </div>

  <div class="section-title">Lojinha</div>
  <div class="shop" id="shop"></div>

  <div class="section-title">Minijogo · Chuva de laranjas</div>
  <div class="game-card">
    <div id="moodPreGame">Capture as laranjas antes que caiam na água e ganhe moedas!</div>
    <div id="gameArea"></div>
    <button id="playBtn" onclick="startGame()">Jogar (30s)</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='capy_save_v1';
let state = load() || {
  fome:80, energia:80, humor:80, coins:40, xp:0, level:1,
  inventory:{}, missionDate:null, missionDone:false, missionType:'alimentar', missionCount:0, missionGoal:3, lastTick:Date.now()
};

const SHOP_ITEMS = [
  {id:'melancia', name:'Melancia', em:'🍉', price:8, type:'fome', value:25},
  {id:'bola', name:'Bolinha', em:'🎾', price:12, type:'brinquedo', value:0},
  {id:'chapeu', name:'Chapéu', em:'👒', value:30, type:'cosmetico'},
  {id:'boia', name:'Boia', em:'🛟', value:35, type:'cosmetico'},
  {id:'flor', name:'Coroa de flor', em:'🌼', value:45, type:'cosmetico'},
  {id:'oculos', name:'Óculos', em:'🕶️', value:40, type:'cosmetico'},
];

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }

function clamp(v){ return Math.max(0, Math.min(100, v)); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h=setTimeout(()=>t.classList.remove('show'), 1600);
}

function checkMission(){
  const today = new Date().toDateString();
  if(state.missionDate !== today){
    state.missionDate = today;
    state.missionDone = false;
    state.missionCount = 0;
    const types=['alimentar','brincar','banho'];
    state.missionType = types[Math.floor(Math.random()*types.length)];
    state.missionGoal = 3;
  }
}

function missionLabel(){
  const names={alimentar:'Alimente a Capy',brincar:'Brinque com a Capy',banho:'Dê banho na Capy'};
  if(state.missionDone) return '✅ Missão do dia concluída! +15 moedas já recebidas';
  return `🎯 Missão: ${names[state.missionType]} (${state.missionCount}/${state.missionGoal}) · +15🪙 +20⭐`;
}

function gainXP(v){
  state.xp += v;
  const need = state.level*50;
  if(state.xp >= need){
    state.xp -= need; state.level++;
    toast('Subiu de nível! Nível '+state.level);
  }
}

function updateEyes(){
  const el=document.getElementById('eyeL'), er=document.getElementById('eyeR'), mouth=document.getElementById('mouth');
  const avg=(state.fome+state.energia+state.humor)/3;
  const label=document.getElementById('moodLabel');
  if(avg<30){
    mouth.setAttribute('d','M20 70 Q24 66 28 70'); label.textContent='A capivara está precisando de cuidado.';
  } else if(avg<65){
    mouth.setAttribute('d','M20 68 Q24 69 28 68'); label.textContent='A capivara está tranquila.';
  } else {
    mouth.setAttribute('d','M20 68 Q24 72 28 68'); label.textContent='A capivara está feliz na água quentinha.';
  }
}

function render(){
  document.getElementById('barFome').style.width = state.fome+'%';
  document.getElementById('barEnergia').style.width = state.energia+'%';
  document.getElementById('barHumor').style.width = state.humor+'%';
  document.getElementById('coins').textContent = state.coins;
  document.getElementById('level').textContent = state.level;
  document.getElementById('missionBar').innerHTML = missionLabel();
  updateEyes();
  renderShop();
  save();
}

function renderShop(){
  const wrap=document.getElementById('shop');
  wrap.innerHTML='';
  SHOP_ITEMS.forEach(it=>{
    const owned = state.inventory[it.id];
    const div=document.createElement('div');
    div.className='item'+((owned && it.type==='cosmetico')?' disabled':'');
    div.innerHTML = `<div class="em">${it.em}</div><div class="name">${it.name}</div><div class="price">${owned && it.type==='cosmetico' ? 'Adquirido' : it.price+' 🪙'}</div>`;
    div.onclick=()=>buyItem(it);
    wrap.appendChild(div);
  });
}

function buyItem(it){
  if(it.type==='cosmetico' && state.inventory[it.id]){ toast('Você já tem esse item'); return; }
  if(state.coins < it.price){ toast('Moedas insuficientes'); return; }
  state.coins -= it.price;
  if(it.type==='fome'){ state.fome = clamp(state.fome+it.value); toast('Melancia entregue! 🍉'); }
  else if(it.type==='brinquedo'){ state.humor = clamp(state.humor+18); toast('Nova bolinha! A Capy adorou.'); }
  else { state.inventory[it.id]=true; toast(it.name+' adicionado ao guarda-roupa!'); }
  render();
}

function petCapy(){
  const el=document.getElementById('capy');
  el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');
  state.humor = clamp(state.humor+2);
  render();
}

function doAction(type){
  const el=document.getElementById('capy');
  el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');

  if(type==='alimentar'){
    if(state.fome>=95){ toast('A Capy já está satisfeita'); return; }
    state.fome = clamp(state.fome+20); state.humor=clamp(state.humor+3); gainXP(3);
  } else if(type==='brincar'){
    if(state.energia<15){ toast('A Capy está cansada demais para brincar'); return; }
    state.humor = clamp(state.humor+15); state.energia=clamp(state.energia-10); gainXP(4);
  } else if(type==='banho'){
    state.humor = clamp(state.humor+12); state.fome=clamp(state.fome-3); gainXP(3);
  } else if(type==='dormir'){
    state.energia = clamp(state.energia+30); gainXP(2);
  }

  checkMission();
  if(!state.missionDone && state.missionType===type){
    state.missionCount++;
    if(state.missionCount>=state.missionGoal){
      state.missionDone=true; state.coins+=15; gainXP(20);
      toast('Missão do dia concluída! +15🪙');
    }
  }
  render();
}

// decaimento passivo ao voltar ao jogo
function applyPassiveDecay(){
  const now=Date.now();
  const mins=(now-(state.lastTick||now))/60000;
  const decay=Math.min(mins*0.5, 60);
  state.fome=clamp(state.fome-decay);
  state.energia=clamp(state.energia-decay*0.6);
  state.humor=clamp(state.humor-decay*0.7);
  state.lastTick=now;
}

// minijogo
let gameTimer=null, gameInterval=null, gameScore=0;
function startGame(){
  const area=document.getElementById('gameArea');
  const btn=document.getElementById('playBtn');
  area.style.display='block'; area.innerHTML=''; btn.disabled=true; btn.textContent='Jogando…';
  gameScore=0;
  let timeLeft=30;
  gameInterval=setInterval(()=>{
    const f=document.createElement('div');
    f.className='fruit'; f.textContent='🍊';
    const x=Math.random()*85;
    f.style.left=x+'%'; f.style.top='-30px';
    area.appendChild(f);
    let y=-30;
    const fall=setInterval(()=>{
      y+=6; f.style.top=y+'px';
      if(y>150){ clearInterval(fall); f.remove(); }
    },40);
    f.onclick=()=>{ gameScore++; clearInterval(fall); f.remove(); };
  }, 550);
  gameTimer=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){ endGame(); }
  },1000);
}
function endGame(){
  clearInterval(gameInterval); clearInterval(gameTimer);
  const area=document.getElementById('gameArea');
  area.querySelectorAll('.fruit').forEach(f=>f.remove());
  const coinsWon = gameScore*2;
  state.coins += coinsWon; state.humor=clamp(state.humor+8); gainXP(gameScore);
  toast(`Fim de jogo! ${gameScore} laranjas · +${coinsWon} moedas`);
  const btn=document.getElementById('playBtn');
  btn.disabled=false; btn.textContent='Jogar novamente (30s)';
  render();
}

checkMission();
applyPassiveDecay();
render();
setInterval(()=>{ state.lastTick=Date.now()-1; applyPassiveDecay(); render(); }, 60000);
</script>
</body>
</html>
