<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pódio Rank - Top 10 Mais Caro</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:20px}
h1{text-align:center}
.card{background:#222;margin:10px 0;padding:15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
button{background:#00ff88;color:#000;border:none;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer}
button:hover{background:#00cc6a}
#loading{text-align:center;padding:20px}
</style>
</head>
<body>
<h1>🏆 PÓDIO RANK - TOP 10</h1>
<p style="text-align:center">Quem paga mais fica no topo! Igual outbid.lol</p>
<div id="loading">Carregando ranking...</div>
<div id="lista"></div>

<script>
let dados = {};
async function loadRanking(){
  try{
    const r = await fetch('/api/ranking');
    dados = await r.json();
    render();
  }catch(e){
    document.getElementById('loading').innerText = "Erro ao carregar. Tenta F5";
  }
}
function render(){
  document.getElementById('loading').style.display='none';
  let html = "";
  for(let i=10; i>=1; i--){
    let d = dados[i];
    if(!d) continue;
    let prox = i===10? d.v : Math.ceil(dados[i+1]?.v * 1.30 || d.v * 1.30);
    if(prox <= d.v) prox = Math.ceil(d.v * 1.30);
    html += `<div class="card">
      <div><b style="font-size:20px">#${i}</b> - <a href="${d.url}" target="_blank" style="color:#00ff88">${d.n}</a><br><small>R$ ${d.v}</small></div>
      <div><button onclick="comprar(${i}, ${prox})">TOMAR POR R$${prox}</button></div>
    </div>`;
  }
  document.getElementById('lista').innerHTML = html;
}
async function comprar(pos, preco){
  let nome = prompt("Seu nome / projeto:");
  if(!nome) return;
  let url = prompt("Seu link (https://...):");
  if(!url) return;
  const res = await fetch('/api/create-preference', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({pos, preco, nome, url})
  });
  const data = await res.json();
  if(data.init_point){ window.location.href = data.init_point; }
  else{ alert("Erro: "+ (data.error||"tenta de novo")); }
}
loadRanking();
</script>
</body>
</html>
