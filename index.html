<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodioRank</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#FFFBF7;color:#111}
.wrap{max-width:650px;margin:0 auto;padding:20px}
h1{font-size:44px;font-weight:900;text-align:center;line-height:1}
h1 span{color:#FF5A36}
.sub{text-align:center;color:#666;margin:10px 0 24px}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.pill{white-space:nowrap;background:#fff;border:1px solid #eee;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700}
.pill.active{background:#111;color:#fff}
.box{background:#fff;border:1px solid #eee;border-radius:24px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,.04)}
.input{display:flex;align-items:center;gap:8px;background:#F7F7F5;border:1px solid #eee;border-radius:999px;padding:14px 18px;margin:16px 0}
.input input{border:0;outline:0;background:transparent;width:100%}
.btn{width:100%;background:#FF5A36;color:#fff;border:0;border-radius:999px;padding:18px;font-weight:900;font-size:18px;cursor:pointer}
.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.counter{text-align:center;color:#999;margin-top:16px;font-size:14px}
.online{font-size:12px;color:#666;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>Claim #1 por <span id="topPrice">R$ 275</span></h1>
<div class="sub">Pódio Principal — modelo infinito igual do gringo</div>
<div class="online">🟢 <span id="on">31</span> online agora • sem limite de 46</div>

<div class="pills">
<div class="pill active">🔥 PRINCIPAL</div>
<div class="pill">📈 MARKETING</div>
<div class="pill">⚖️ ADVOGADOS</div>
<div class="pill">🩺 MÉDICOS</div>
</div>

<div class="box">
<div style="font-weight:800">Seja #1 por <span id="price2">R$ 275</span></div>
<div class="input">🌐 <input id="url" placeholder="Cole seu link aqui"></div>
<button class="btn" onclick="pagar()">DAR LANCE →</button>
</div>

<div id="list"></div>
<div class="counter" id="count">1 - 3 of 3</div>
</div>

<script>
let ranks = JSON.parse(localStorage.getItem('ranks')||'null') || [
{nome:'Além dos Versículos - 355K', preco:274.33},
{nome:'Rupert - 48K', preco:211.02},
{nome:'PEDRO - 1,4K', preco:162.32},
];

function render(){
ranks.sort((a,b)=>b.preco-a.preco);
let top = ranks[0].preco * 1.3;
document.getElementById('topPrice').innerText = `R$ ${top.toFixed(2)}`;
document.getElementById('price2').innerText = `R$ ${top.toFixed(2)}`;
document.getElementById('count').innerText = `1 - ${ranks.length} of ${ranks.length} — infinito`;
let h='';
ranks.forEach((r,i)=>{
h+=`<div class="card"><div><b>#${i+1}</b> ${r.nome}</div><b style="color:#FF5A36">R$ ${r.preco.toFixed(2)}</b></div>`;
});
document.getElementById('list').innerHTML=h;
}

function pagar(){
let url=document.getElementById('url').value;
if(!url) return alert('Cola seu link');
let price = ranks[0].preco * 1.3;
// chama seu Mercado Pago na pasta api/
location.href = `/api/checkout?link=${encodeURIComponent(url)}&price=${price}`;
}

render();
</script>
</body>
</html>
