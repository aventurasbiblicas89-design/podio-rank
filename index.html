<style>
:root{--bg:#0B1226;--bg2:#16203A;--ink:#F5F0E3;--mut:#B9BFD0;--gold:#E0B65A;--glow:#FFD98A;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
canvas#motes{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bar{position:fixed;left:0;right:0;height:50vh;background:#000;z-index:50;pointer-events:none;animation:open 1.8s cubic-bezier(.7,0,.2,1) .2s forwards}
.bar.t{top:0}.bar.b{bottom:0}
@keyframes open{to{height:0}}
main,.hero{position:relative;z-index:3}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;display:flex;gap:6px;z-index:5}
.top button{padding:7px 12px;border-radius:99px;border:1px solid #ffffff30;background:#0B122680;color:var(--ink);font:600 13px system-ui;cursor:pointer;backdrop-filter:blur(6px)}
.top button[aria-pressed=true]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.live{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;border:1px solid #ffffff30;background:#0B122680;backdrop-filter:blur(6px);font:600 13px system-ui;color:var(--ink)}
.live[hidden]{display:none}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 0 #4ADE8088;animation:ping 2s infinite}
@keyframes ping{70%,100%{box-shadow:0 0 0 9px #4ADE8000}}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:90px 24px 64px;max-width:560px;margin:0 auto;overflow:visible}
.beam{position:absolute;left:50%;top:-10%;width:140%;height:90%;transform:translateX(-50%) rotate(-8deg);transform-origin:50% 0;background:conic-gradient(from 180deg at 50% 0,transparent 160deg,#FFD98A22 175deg,#FFD98A44 180deg,#FFD98A22 185deg,transparent 200deg);filter:blur(18px);animation:sway 16s ease-in-out infinite alternate;z-index:0;pointer-events:none}
@keyframes sway{to{transform:translateX(-50%) rotate(9deg)}}
.hero>*:not(.beam){position:relative;z-index:1}
.hero>.top,.hero>.live{position:absolute}
.seq{opacity:0;animation:rise 1.6s ease forwards;animation-delay:var(--d)}
@keyframes rise{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.l1,.l2{color:var(--mut);font:italic 19px/1.5 var(--serif);margin:0 0 4px}
h1{font:600 clamp(46px,15vw,76px)/1 var(--serif);margin:26px 0 18px;letter-spacing:-.02em}
h1 span{display:block;color:var(--glow);text-shadow:0 0 40px #FFD98A55}
.sub{color:var(--mut);max-width:30ch;margin:0 0 28px}
.cta{display:inline-block;padding:17px 26px;border-radius:99px;background:var(--gold);color:var(--bg);font:700 18px system-ui;text-decoration:none;border:0;cursor:pointer;box-shadow:0 0 0 0 #E0B65A66;animation:pulse 2.8s 4.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #E0B65A66}70%,100%{box-shadow:0 0 0 18px #E0B65A00}}
.alt{display:block;margin-top:16px;background:none;border:0;color:var(--glow);font:600 16px system-ui;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px 0}
.book{width:min(58vw,250px);margin:44px 0 0 auto;transform:rotate(3deg);border-radius:5px;box-shadow:0 30px 70px #000,0 0 90px #FFD98A33}
section{max-width:560px;margin:0 auto;padding:70px 24px 10px}
h2{font:600 32px/1.15 var(--serif);margin:0 0 14px}
p{margin:0 0 14px;color:var(--mut)}
.verse{background:linear-gradient(160deg,#1F2A44,#101935);border:1px solid #E0B65A40;border-radius:18px;padding:28px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.verse q{font:italic 24px/1.35 var(--serif);quotes:none;color:var(--ink);display:block}
.verse cite{display:block;margin-top:12px;color:var(--gold);font:600 15px system-ui;font-style:normal}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn2{padding:13px 18px;border-radius:99px;border:1px solid var(--gold);background:transparent;color:var(--ink);font:600 15px system-ui;cursor:pointer;text-decoration:none}
.btn2.fill{background:var(--gold);color:var(--bg)}
.chap{list-style:none;padding:0;margin:0;border-left:2px solid #E0B65A55}
.chap li{padding:0 0 22px 20px;position:relative}
.chap li::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.chap b{display:block;font:600 21px/1.3 var(--serif);color:var(--ink)}
.chap span{color:var(--mut);font-size:15px}
.buy{background:radial-gradient(120% 90% at 50% 0,#243257,#111a33);border:1px solid #E0B65A40;border-radius:22px;padding:30px 22px;text-align:center}
.price{font:600 56px/1 var(--serif);color:var(--glow);margin:6px 0}
.buy .cta{width:100%;animation:none;margin-top:12px}
.buy .cta:disabled{opacity:.6}
#err{color:#ffb4a8;min-height:1.3em;font-size:15px;margin-top:8px}
.small{font-size:14px}
footer{max-width:560px;margin:0 auto;padding:50px 24px calc(110px + env(safe-area-inset-bottom))}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0B1226 40%);transform:translateY(120%);transition:transform .5s}
.bottom.on{transform:none}
.bottom .cta{display:block;width:100%;text-align:center;animation:none}
@media (prefers-reduced-motion:reduce){.bar{animation:none;height:0}.beam{animation:none}.seq{animation:none;opacity:1}.cta{animation:none}.live i{animation:none}html{scroll-behavior:auto}.bottom{transition:none}}
</style></head><body>
<div class="bar t"></div><div class="bar b"></div>
<canvas id="motes" aria-hidden="true"></canvas><div class="grain" aria-hidden="true"></div>

<div class="hero">
  <div class="beam" aria-hidden="true"></div>
  <div class="live" id="live" hidden><i></i><span id="lv"></span></div>
  <div class="top" role="group" aria-label="Idioma / Idioma">
    <button id="bpt" aria-pressed="true">PT</button><button id="bes" aria-pressed="false">ES</button>
  </div>
  <p class="l1 seq" style="--d:2s" data-i="l1"></p>
  <p class="l2 seq" style="--d:3.2s" data-i="l2"></p>
  <h1 class="seq" style="--d:4.6s"><span data-i="h1a"></span><span data-i="h1b"></span></h1>
  <p class="sub seq" style="--d:6s" data-i="sub"></p>
  <div class="seq" style="--d:6.8s"><a class="cta" href="#comprar" data-i="cta1"></a><button class="alt" id="alt" data-i="alt"></button></div>
  <img class="book seq" style="--d:7.4s" id="cover" alt="Capa do e-book" width="250" height="355">
</div>

<main>
<section aria-labelledby="hv">
  <h2 id="hv" data-i="hv"></h2>
  <p data-i="pv"></p>
  <div class="verse" aria-live="polite"><q id="vt"></q><cite id="vr"></cite></div>
  <div class="row">
    <button class="btn2 fill" id="nv" data-i="nv"></button>
    <a class="btn2" id="wa" target="_blank" rel="noopener" data-i="wa"></a>
    <button class="btn2" id="sh" data-i="sh"></button>
  </div>
</section>

<section aria-labelledby="hi">
  <h2 id="hi" data-i="hi"></h2>
  <ol class="chap" id="chap"></ol>
</section>

<section id="comprar" aria-labelledby="hb">
  <div class="buy">
    <h2 id="hb" data-i="hb"></h2>
    <div class="price">R$ 14,90</div>
    <p class="small" data-i="pn"></p>
    <button class="cta" id="buy"></button>
    <div id="err" role="alert"></div>
  </div>
</section>

<section aria-labelledby="hs">
  <h2 id="hs" data-i="hs"></h2>
  <p data-i="ps"></p>
  <div class="row"><a class="btn2 fill" id="wa2" target="_blank" rel="noopener" data-i="wa2"></a></div>
</section>
</main>
<footer aria-hidden="true"></footer>
<div class="bottom" id="bottom"><a class="cta" href="#comprar" id="cta2"></a></div>
