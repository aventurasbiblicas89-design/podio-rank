<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PódioRank - TOP 10</title>
<style>
:root{--bg:#0f1117;--card:#1c1f2b;--acc:#00ff88;--red:#ff3b3b}
body{background:var(--bg);color:#fff;font-family:system-ui;margin:0;padding:16px}
.wrap{max-width:900px;margin:auto}
.badge{background:var(--card);border:1px solid #00ff8850;padding:10px 16px;border-radius:99px;display:inline-flex;gap:8px;margin:12px 0}
.dot{width:8px;height:8px;background:var(--red);border-radius:50%;animation:p 1s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.card{background:var(--card);padding:14px;border-radius:12px;margin:10px 0;display:flex;justify-content:space-between}
.btn{background:var(--acc);color:#000;padding:18px;border-radius:14px;text-decoration:none;font-weight:900;display:block;text-align:center;font-size:18px;margin:18px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s{opacity:.6;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>🏆 PódioRank</h1>
<div class="badge"><span class="dot"></span> <span id="counter">Carregando...</span></div>
<a class="btn" href="#" onclick="comprar(1);return false">🔥 ENTRAR NO TOP 10 - R$29,90 PIX</a>
<div id="top"></div>
</div>
<script>
const dados={
  10:{n:"Pedro @mercado",v:15},
  9:{n:"Livre",v:20},
  8:{n:"Livre",v:26},
  7:{n:"Livre",v:34},
  6:{n:"Livre",v:44},
  5:{n:"Livre",v:57},
  4:{n:"Livre",v:74},
  3:{n:"Livre",v:96},
  2:{n:"Livre",v:125},
  1:{n:"Livre",v:163}
}
function render(){
  let h="";for(let i=10;i>=1;i--){h+=`<div class="card"><span><b>#${i}</b> ${dados[i].n}</span><span class="s">R$${dados[i].v}</span></div>`}
  document.getElementById('top').innerHTML=h;
  let on=27;setInterval(()=>{on+=Math.floor(Math.random()*5)-2;if(on<15)on=15;if(on>59)on=59;document.getElementById('counter').innerText=`${on} pessoas online agora • ${Object.keys(dados).length} no ranking • 3 vagas`},2000);
}render();
async function comprar(idx){
  const b=event.target;const t=b.innerText;b.innerText="⏳ Gerando PIX...";b.style.opacity=".6";
  try{
    const r=await fetch('/api/create-preference',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:idx,name:"PódioRank Top "+idx,url:"https://podiorank.com.br",price:29.90,siteUrl:"podiorank.com.br",title:"PódioRank TOP 10"})});
    const d=await r.json();if(d.init_point)location.href=d.init_point;else{alert("Erro: "+(d.error||JSON.stringify(d)));b.innerText=t;b.style.opacity="1";}
  }catch(e){alert("Erro conexao");b.innerText=t;b.style.opacity="1";}
}
</script>
</body>
</html>
