<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PÓDIO RANK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fbfbf9;color:#111;font-family:system-ui,sans-serif;padding:20px}
h1{font-size:42px;text-align:center;font-weight:900}h1 span{color:#c8a44a}
.sub{color:#666;text-align:center;margin:10px 0 20px}
.stats{display:flex;gap:12px;justify-content:center;margin:0 0 20px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #eee;border-radius:999px;padding:8px 16px;font-size:14px;box-shadow:0 2px 8px #0001}
#lista{max-width:600px;margin:0 auto;display:grid;gap:14px}
.card{background:#fff;border-radius:24px;padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px #0001}
.pos{color:#c8a44a;font-weight:700;font-size:12px}
.nome{font-weight:800;font-size:18px;text-transform:uppercase;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url{font-size:12px;color:#888;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preco{font-weight:900;font-size:20px;text-align:right}
button{background:#111;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:800;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<h1>PÓDIO <span>RANK</span></h1>
<div class="sub">Quem paga mais fica no topo. 100% automático.</div>
<div class="stats"><div class="stat">Volume: <b id="vol">R$ 0,00</b></div><div class="stat"><b>30% a mais</b> pra tomar posição</div></div>
<div id="lista">Carregando...</div>
<script>
const PRECOS_BASE = {10:30,9:39,8:50.7,7:65.91,6:85.68,5:111.39,4:144.8,3:188.24,2:244.72,1:318.14};
async function carregar(){
  try{
    const r = await fetch('/api/ranking?t='+Date.now());
    const d = await r.json();
    let total=0; let html='';
    for(let i=10;i>=1;i--){
      let item = d[i];
      // SE VIER UNDEFINED, USA O BASE
      if(!item ||!item.nome || item.nome=='undefined' || item.nome=='UNDEFINED'){
        item = {preco: PRECOS_BASE[i], nome:'LIVRE', url:'https://podiorank.com.br'};
      }
      const preco = Number(item.preco || PRECOS_BASE[i]);
      total+=preco;
      const prox = (preco*1.3).toFixed(2);
      const nomeLimpo = (item.nome && item.nome!='undefined')? item.nome : 'LIVRE';
      const urlLimpa = item.url || 'https://podiorank.com.br';
      html+=`<div class="card"><div><div class="pos">#${i} POSIÇÃO</div><div class="nome">${nomeLimpo}</div><div class="url">${urlLimpa}</div></div><div style="text-align:right"><div class="preco">R$ ${preco.toFixed(2).replace('.',',')}</div><button onclick="comprar(${i},${prox})">TOMAR</button></div></div>`;
    }
    document.getElementById('lista').innerHTML=html;
    document.getElementById('vol').innerText='R$ '+total.toFixed(2).replace('.',',');
  }catch(e){
    document.getElementById('lista').innerHTML='Erro ao carregar. Recarregue.';
  }
}
async function comprar(pos,valor){
  const nome=prompt('Sua marca / nome:'); if(!nome) return;
  let url=prompt('Seu link (https://...):','https://'); if(!url) return;
  if(!url.startsWith('http')) url='https://'+url;
  try{
    const res=await fetch('/api/create-preference',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({posicao:pos,nome,url,valor})});
    const data=await res.json();
    if(data.init_point) window.location.href=data.init_point;
    else alert('Erro Mercado Pago: '+(data.error||JSON.stringify(data)));
  }catch(e){alert('Erro de conexão com API');}
}
carregar();
</script>
</body>
</html>
