<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podio Rank - Seja #1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f5f5;padding:12px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.input{width:100%;padding:16px;border-radius:30px;border:1px solid #ddd;font-size:16px;margin:12px 0}
.btn{width:100%;background:#ff3b0f;color:#fff;border:0;border-radius:30px;padding:18px;font-size:18px;font-weight:800;cursor:pointer}
.btn:active{transform:scale(.98)}
.small{color:#777;font-size:13px;text-align:center;margin:10px 0}
.rank{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
.badge{background:#000;color:#fff;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800}
.tomar{margin-left:auto;background:#ffe8e0;color:#ff3b0f;border:1px solid #ffccbc;padding:8px 18px;border-radius:20px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="card">
<h2 style="text-align:center">Seja #1 por R$ 274,33</h2>
<input id="link" class="input" placeholder="🌐 Cole seu link aqui (site, insta, youtube)">
<button id="btnPagar" class="btn" onclick="pagar()">DAR LANCE DE R$ 274,33 →</button>
<p class="small">Garantido por 30 dias. Depois só sai se alguém pagar mais que você.</p>
<p class="small" id="volume">Volume total: R$ 900,33</p>
</div>

<div class="card" id="lista">
Carregando ranking...
</div>

<script>
let rankingData = [];

async function carregar() {
  try {
    const r = await fetch('/api/ranking');
    const data = await r.json();
    rankingData = data;
    render(data);
  } catch(e){
    document.getElementById('lista').innerHTML = 'Erro ao carregar ranking';
  }
  try {
    const s = await fetch('/api/stats');
    const st = await s.json();
    if(st.total) document.getElementById('volume').innerText = 'Volume total: R$ ' + st.total;
  } catch(e){}
}

function render(data){
  if(!data || data.length===0){
    data = [
      {pos:1, nome:'Além dos Versículos - 355K', valor:211.02, cliques:355000},
      {pos:2, nome:'Rupert - 48K', valor:162.33, cliques:48000},
      {pos:3, nome:'PEDRO - 1ª Venda ⭐', valor:150, cliques:89},
      {pos:4, nome:'LIVRE - Clique para ocupar', valor:96.05, cliques:0, livre:true}
    ];
  }
  document.getElementById('lista').innerHTML = data.map((item,i)=>`
    <div class="rank">
      <div class="badge">#${i+1}</div>
      <div style="flex:1">
        <div style="font-weight:800">#${i+1} ${item.nome || item.title || 'Link'}</div>
        <div style="color:#777;font-size:13px">R$ ${item.valor || item.price || '0'} · 👁️ ${item.cliques || item.clicks || 0} cliques · <span style="color:#ff3b0f">ver →</span></div>
      </div>
      <button class="tomar" onclick="tomar(${i})">${item.livre?'DAR LANCE':'TOMAR'}</button>
    </div>
  `).join('');
}

function tomar(i){
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('link').focus();
}

async function pagar(){
  const link = document.getElementById('link').value;
  if(!link){
    alert('Cole seu link primeiro');
    return;
  }
  const btn = document.getElementById('btnPagar');
  btn.innerText = 'ABRINDO MERCADO PAGO...';
  btn.disabled = true;
  try{
    const r = await fetch('/api/checkout', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({link: link})
    });
    const text = await r.text();
    let data;
    try{
      data = JSON.parse(text);
    }catch(e){
      alert('Erro no servidor. Resposta: ' + text.substring(0,200));
      console.log(text);
      btn.innerText = 'DAR LANCE DE R$ 274,33 →';
      btn.disabled = false;
      return;
    }
    if(data.url){
      window.location.href = data.url;
    } else {
      alert('Erro: ' + (data.erro || JSON.stringify(data.detalhe || data)));
      console.log(data);
      btn.innerText = 'DAR LANCE DE R$ 274,33 →';
      btn.disabled = false;
    }
  }catch(e){
    alert('Erro de conexao: ' + e.message);
    btn.innerText = 'DAR LANCE DE R$ 274,33 →';
    btn.disabled = false;
  }
}

carregar();
</script>
</body>
</html>
