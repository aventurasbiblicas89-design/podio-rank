<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pódio — O ranking que você disputa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg: #0E1220;
 --bg-raised: #161B2E;
 --bg-raised-2: #1D2338;
 --text: #E9ECF6;
 --text-dim: #9AA1BC;
 --line: rgba(233,236,246,0.09);
 --gold: #FFB020;
 --silver: #C7CEDC;
 --bronze: #E07A4E;
}
*{font-family:Inter,sans-serif;box-sizing:border-box}
body{background:var(--bg);color:var(--text);margin:0}
.header{text-align:center;padding:50px 20px;border-bottom:1px solid var(--line)}
.header h1{font-size:42px;margin:0;letter-spacing:-1px}
.header h1 span{color:var(--gold)}
.header p{color:var(--text-dim);max-width:600px;margin:14px auto;line-height:1.5}
.badge{background:var(--bg-raised);border:1px solid var(--line);padding:8px 16px;border-radius:100px;font-size:13px;display:inline-block;margin-top:12px}
.badge b{color:var(--gold)}
.wrap{max-width:1100px;margin:30px auto;padding:0 20px}
.card{background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px}
.pos{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.pos:first-child{border-top:0}
.btn{background:var(--gold);color:#000;border:0;padding:7px 12px;border-radius:8px;font-weight:800;font-size:12px;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--bg-raised-2);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
</style>
</head>
<body>
<div class="header">
  <h1>Pódio<span>Rank</span></h1>
  <p><b style="color:var(--text)">Só existem 10 posições.</b> Tome uma vaga e o preço dela sobe 30% pro próximo. Reseta todo domingo.</p>
  <div class="badge" id="counter">1/46 vagas ocupadas</div>
</div>

<div class="wrap">
  <div class="card">
    <h3 style="margin:0 0 10px">🔥 Pódio Principal - Top 10</h3>
    <div id="principal"></div>
  </div>

  <h3>📂 Categorias - 12x3 = 36 vagas</h3>
  <div class="grid" id="cats"></div>
</div>

<script>
const principalData = { 10: {name:"Pedro @meme-zinho", url:"youtube.com/@meme-zinho", valor:15} };
const catData = { youtube_3: {name:"Pedro @meme-zinho", valor:15} };
const prox = v => Math.ceil(v*1.3);
const CATS = [
 {id:'marketing',nome:'🔥 Marketing'},{id:'dev',nome:'🛠️ Dev Tools'},{id:'ia',nome:'🤖 IA'},{id:'seo',nome:'🔍 SEO'},
 {id:'youtube',nome:'🎬 YouTube'},{id:'seguranca',nome:'🔒 Security'},{id:'financas',nome:'💰 Finanças'},{id:'ecommerce',nome:'🛒 E-commerce'},
 {id:'design',nome:'🎨 Design'},{id:'prod',nome:'⚡ Produtividade'},{id:'crypto',nome:'₿ Crypto'},{id:'geral',nome:'🌍 Geral'}
];
function render(){
 let total = Object.keys(principalData).length + Object.keys(catData).length;
 document.getElementById('counter').innerHTML = `<b>${total}/46</b> vagas ocupadas • 10 principal + 36 categorias`;
 let h=""; for(let i=1;i<=10;i++){const it=principalData[i]; if(it){h+=`<div class="pos"><span><b>#${i} ${it.name}</b> <small style="color:var(--text-dim)">R$${it.valor}</small></span><a class="btn" href="/checkout?pos=${i}&cat=principal&preco=${prox(it.valor)}">Tomar R$${prox(it.valor)}</a></div>`}else{const base=i===10?15:15+(10-i)*5; h+=`<div class="pos"><span>#${i} Livre</span><a class="btn ghost" href="/checkout?pos=${i}&cat=principal&preco=${base}">R$${base}</a></div>`}} document.getElementById('principal').innerHTML=h;
 const grid=document.getElementById('cats'); grid.innerHTML=""; CATS.forEach(c=>{let html=`<div class="card"><b>${c.nome}</b>`; for(let p=1;p<=3;p++){const k=`${c.id}_${p}`; const it=catData[k]; if(it){html+=`<div class="pos"><span>#${p} ${it.name}</span><a class="btn" href="/checkout?pos=${p}&cat=${c.id}&preco=${prox(it.valor)}">R$${prox(it.valor)}</a></div>`}else{const base=c.id==='youtube'&&p===3?15:20+(3-p)*5; html+=`<div class="pos"><span>#${p} Livre</span><a class="btn ghost" href="/checkout?pos=${p}&cat=${c.id}&preco=${base}">R$${base}</a></div>`}} html+=`</div>`; grid.innerHTML+=html;});
}
render();
</script>
</body>
</html>
