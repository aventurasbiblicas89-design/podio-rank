<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PódioRank — Só 10 no topo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0E1220;--bg-raised:#161B2E;--bg-raised-2:#1D2338;
 --text:#E9ECF6;--text-dim:#9AA1BC;--line:rgba(233,236,246,0.09);
 --gold:#FFB020;--silver:#C7CEDC;--bronze:#E07A4E;
}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text);margin:0;padding-bottom:80px}
.header{text-align:center;padding:48px 20px;border-bottom:1px solid var(--line)}
.header h1{font-size:40px;margin:0;letter-spacing:-1px}
.header h1 span{color:var(--gold)}
.header p{color:var(--text-dim);max-width:620px;margin:12px auto;line-height:1.5}
.badge{display:inline-block;margin-top:12px;background:var(--bg-raised);border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-size:13px}
.badge b{color:var(--gold)}
.wrap{max-width:1100px;margin:28px auto;padding:0 20px}
.card{background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.pos{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.pos:first-child{border-top:0}
.btn{background:var(--gold);color:#000;border:0;padding:7px 12px;border-radius:8px;font-weight:800;font-size:12px;text-decoration:none}
.btn.ghost{background:var(--bg-raised-2);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
small{color:var(--text-dim)}
.zap{position:fixed;bottom:22px;right:22px;background:var(--gold);color:#000;padding:13px 20px;border-radius:99px;font-weight:800;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:9999;font-size:14px}
</style>
</head>
<body>
<div class="header">
  <h1>Pódio<span>Rank</span></h1>
  <p><b style="color:var(--text)">Só existem 10 posições no Pódio Principal.</b> Toda vez que alguém toma sua vaga, o preço sobe 30%. Reseta domingo 23:59.</p>
  <div class="badge" id="counter">Carregando...</div>
</div>

<div class="wrap">
  <div class="card"><h3 style="margin:0 0 8px">🔥 Pódio Principal — 10 vagas</h3><div id="principal"></div></div>
  <h3 style="margin:24px 0 12px">📂 Categorias — 12×3 = 36 vagas</h3>
  <div class="grid" id="cats"></div>
</div>

<a class="zap" href="https://wa.me/5511925681508?text=Vi%20o%20PódioRank%20e%20quero%20uma%20vaga" target="_blank">💬 WhatsApp</a>

<script>
const principalData={10:{name:"Pedro @meme-zinho",url:"youtube.com/@meme-zinho",valor:15}};
const catData={};
const prox=v=>Math.ceil(v*1.3);
const CATS=[
 {id:'marketing',nome:'🔥 Marketing'},{id:'dev',nome:'🛠️ Dev Tools'},{id:'ia',nome:'🤖 IA'},{id:'seo',nome:'🔍 SEO'},
 {id:'youtube',nome:'🎬 YouTube'},{id:'seguranca',nome:'🔒 Security'},{id:'financas',nome:'💰 Finanças'},{id:'ecommerce',nome:'🛒 E-commerce'},
 {id:'design',nome:'🎨 Design'},{id:'prod',nome:'⚡ Produtividade'},{id:'crypto',nome:'₿ Crypto'},{id:'geral',nome:'🌍 Geral'}
];
function render(){
 const total=Object.keys(principalData).length+Object.keys(catData).length;
 document.getElementById('counter').innerHTML=`<b>${total}/46</b> vagas ocupadas • 10 principal + 36 categorias`;
 let h="";for(let i=1;i<=10;i++){const it=principalData[i];if(it){h+=`<div class="pos"><span><b>#${i} ${it.name}</b> <small>R$${it.valor}</small></span><a class="btn" href="https://wa.me/5511925681508?text=Quero%20tomar%20a%20vaga%20%23${i}%20do%20Pódio%20por%20R$${prox(it.valor)}">Tomar R$${prox(it.valor)}</a></div>`}else{const base=i===10?15:15+(10-i)*5;h+=`<div class="pos"><span>#${i} Livre</span><a class="btn ghost" href="https://wa.me/5511925681508?text=Quero%20a%20vaga%20%23${i}%20do%20Pódio%20por%20R$${base}">R$${base}</a></div>`}}
 document.getElementById('principal').innerHTML=h;
 const grid=document.getElementById('cats');grid.innerHTML="";CATS.forEach(c=>{let html=`<div class="card"><b>${c.nome}</b>`;for(let p=1;p<=3;p++){const k=`${c.id}_${p}`;const it=catData[k];if(it){html+=`<div class="pos"><span>#${p} ${it.name}</span><a class="btn" href="https://wa.me/5511925681508?text=Quero%20tomar%20a%20vaga%20%23${p}%20de%20${c.nome}%20por%20R$${prox(it.valor)}">R$${prox(it.valor)}</a></div>`}else{const base=c.id==='youtube'&&p===3?15:20+(3-p)*5;html+=`<div class="pos"><span>#${p} Livre</span><a class="btn ghost" href="https://wa.me/5511925681508?text=Quero%20a%20vaga%20%23${p}%20de%20${c.nome}%20por%20R$${base}">R$${base}</a></div>`}}html+=`</div>`;grid.innerHTML+=html;});
}
render();
</script>
</body>
</html>
