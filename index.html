<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PódioRank</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090f] text-white min-h-screen">
<div class="max-w-6xl mx-auto p-4 md:p-8">

<div class="text-center mt-6">
<h1 class="text-5xl md:text-6xl font-black">Pódio<span class="text-orange-500">Rank</span></h1>
<p class="mt-3 text-zinc-400 text-sm max-w-2xl mx-auto">Só 10 posições no Pódio Principal. Quando alguém toma sua vaga, o preço sobe 30%. Reseta domingo 23:59.</p>
<div class="flex gap-2 justify-center mt-5 flex-wrap">
<div id="online" class="bg-red-500/15 border border-red-500/30 px-4 py-2 rounded-full text-xs">🔴 28 pessoas online agora • 10 no ranking • 3 vagas livres</div>
<div class="bg-amber-500/15 border border-amber-500/30 px-4 py-2 rounded-full text-xs font-bold text-amber-300">1/46 vagas ocupadas • 10 principal + 36 categorias</div>
</div>
</div>

<div class="max-w-3xl mx-auto mt-10 bg-[#13131d] rounded-[20px] p-6 border border-white/10">
<h2 class="font-bold mb-4">🔥 Pódio Principal — 10 vagas</h2>
<div id="principal"></div>
</div>

<div id="cats" class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4"></div>
<p class="text-center text-[10px] text-zinc-600 mt-12">www.podiorank.com.br • Mercado Pago ativo</p>
</div>

<script>
const CATS = ["Mercado","Marketing","Ecom","YouTube","SEO","Finanças","Design","Infoproduto","PLR","Tráfego","Afiliado","SaaS"];
const PRINCIPAL = [
  {n:1, nome:"🥇 #1 Além dos Versículos - 355K", valor:274.33, destaque:true},
  {n:2, nome:"🥈 #2 Rupert - 48K", valor:211.02},
  {n:3, nome:"#3 PEDRO - 1,4K", valor:162.32},
  {n:4, nome:"#4 LIVRE", valor:124.86},
  {n:5, nome:"#5 LIVRE", valor:35},
  {n:6, nome:"#6 LIVRE", valor:35},
  {n:7, nome:"#7 LIVRE", valor:35},
  {n:8, nome:"#8 LIVRE", valor:35},
  {n:9, nome:"#9 LIVRE", valor:35},
  {n:10, nome:"#10 LIVRE", valor:35},
];

function renderPrincipal(){
  document.getElementById('principal').innerHTML = PRINCIPAL.map(p=>`
    <div class="flex justify-between items-center py-3 border-b border-white/5 ${p.n>4?'opacity-60':''}">
      <span class="text-sm">${p.nome}</span>
      <button onclick="pagar('${p.nome}', ${p.valor}, this)" class="${p.destaque?'bg-orange-500':'bg-white text-black'} px-4 py-2 rounded-xl text-xs font-bold">
        ${p.destaque?`TOMAR #1 - R$ ${p.valor}`:`R$ ${p.valor}`}
      </button>
    </div>
  `).join('');
}
function renderCats(){
  document.getElementById('cats').innerHTML = CATS.map(c=>`
    <div class="bg-[#13131d] rounded-2xl p-5 border border-white/10">
      <h3 class="font-bold text-sm mb-3">🏆 ${c} — 3 vagas</h3>
      <div class="text-xs text-zinc-500 space-y-1"><div>#1 Livre</div><div>#2 Livre</div><div>#3 Livre</div></div>
      <button onclick="pagar('${c}', 29.90, this)" class="w-full mt-4 bg-white text-black py-2.5 rounded-xl font-bold text-xs">PEGAR VAGA - R$ 29,90</button>
    </div>
  `).join('');
}

async function pagar(pos, valor, btn){
  const txt = btn.innerText;
  btn.innerText = '...';
  btn.disabled = true;
  try{
    const r = await fetch('/api/checkout', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({posicao:pos, valor})
    });
    const d = await r.json();
    if(d.init_point) window.location.href = d.init_point;
    else { alert('Erro: '+JSON.stringify(d).slice(0,200)); btn.innerText=txt; btn.disabled=false; }
  }catch(e){ alert('Erro checkout'); btn.innerText=txt; btn.disabled=false; }
}

let online = 28;
setInterval(()=>{ online = Math.max(18, Math.min(45, online + Math.floor(Math.random()*3)-1)); document.getElementById('online').innerText = `🔴 ${online} pessoas online agora • 10 no ranking • 3 vagas livres`; },2500);

renderPrincipal(); renderCats();
</script>
</body>
</html>
