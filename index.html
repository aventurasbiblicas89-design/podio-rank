<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PódioRank - Top Cursos</title>
<style>
:root{--bg:#0f1117;--card:#1c1f2b;--text:#fff;--acc:#00ff88}
body{background:var(--bg);color:var(--text);font-family:Arial;margin:0;padding:20px}
.badge{background:var(--card);padding:10px 20px;border-radius:20px;display:inline-block;margin:10px 0}
.wrap{max-width:900px;margin:auto}
.card{background:var(--card);padding:16px;border-radius:12px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zap{background:var(--acc);color:#000;padding:16px 24px;border-radius:12px;text-decoration:none;font-weight:bold;display:inline-block;margin:20px 0;text-align:center;width:100%;box-sizing:border-box}
small{opacity:0.7}
b{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<h1>🏆 PódioRank</h1>
<p><b style="color:var(--text)">Só entra no Top 10 quem realmente vende</b></p>
<div class="badge" id="counter">Carregando...</div>

<a class="zap" href="#" onclick="comprar('PódioRank PRO - Top 10', 29.90); return false;">🔥 QUERO ENTRAR NO TOP 10 - R$29,90 PIX</a>

<div class="wrap">
<div class="card"><h3 style="margin:0">🔥 Top 10 Principal</h3><div id="principal"></div></div>
<h3 style="margin:24px 0 12px">📦 Categorias</h3>
<div class="grid" id="cats"></div>
</div>
</div>

<script>
const principalData={10:{name:"Pedro @mercado",valor:3200},9:{name:"Ana Marketing",valor:2800},8:{name:"João E-com",valor:2500},7:{name:"Carla YouTube",valor:2100},6:{name:"Marcos SEO",valor:1900},5:{name:"Julia Finanças",valor:1700},4:{name:"Rafa Design",valor:1500},3:{name:"Léo Crypto",valor:1200},2:{name:"Bia Geral",valor:900},1:{name:"Seu Nome Aqui",valor:500}};
const catData={};
const prox=v=>Math.ceil(v*1.3);
const CATS=[
{id:'marketing',nome:'🔥 Marketing'},{id:'financas',nome:'💰 Finanças'},
{id:'youtube',nome:'🎬 YouTube'},{id:'seo',nome:'🔍 SEO'},
{id:'ecommerce',nome:'🛒 E-commerce'},{id:'crypto',nome:'₿ Crypto'},
{id:'design',nome:'🎨 Design'},{id:'prod',nome:'📦 Produtos'},
{id:'geral',nome:'🌍 Geral'}
];

function render(){
  const total=Object.keys(principalData).length;
  document.getElementById('counter').innerText= total + ' no ranking principal + 36 categorias';
  let h="";for(let i=10;i>=1;i--){const it=principalData[i]; if(!it) continue; h+=`<div class="card"><b>#${i} ${it.name}</b> <small>R$${it.valor}</small> ${i==1?'<br><br><a class="zap" href="#" onclick="comprar(\'Top 1 - '+it.name+'\',29.90);return false;" style="margin:0;padding:10px">Tomar essa posição - R$29,90</a>':''}</div>`;}
  document.getElementById('principal').innerHTML=h;
  const grid=document.getElementById('cats');
  let g=""; CATS.forEach(c=>{ g+=`<div class="card"><b>${c.nome}</b><br><small>Top 10 disponível</small><br><br><a class="zap" href="#" onclick="comprar('Categoria ${c.nome}',29.90);return false;" style="margin:0;padding:10px;font-size:14px">Entrar - R$29,90</a></div>`; });
  grid.innerHTML=g;
}
render();

async function comprar(produto, valor){
  const btn = event.target;
  const original = btn.innerText;
  btn.innerText = "⏳ Gerando PIX...";
  btn.style.opacity = "0.6";
  try{
    const res = await fetch('/api/create-preference', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title: produto, price: valor})
    });
    const data = await res.json();
    if(data.init_point){
      window.location.href = data.init_point;
    }else{
      alert("Erro: " + (data.error || JSON.stringify(data)));
      btn.innerText = original;
      btn.style.opacity = "1";
    }
  }catch(e){
    alert("Erro de conexão");
    btn.innerText = original;
    btn.style.opacity = "1";
  }
}
</script>
</body>
</html>
