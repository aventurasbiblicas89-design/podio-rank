<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podio Rank</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#FFFAF5}.card{background:#FFF1E8}</style>
</head>
<body>
<div class="max-w-[520px] mx-auto px-4 pt-3 pb-20">

<div class="flex justify-between py-2"><span>☰</span><b>podiorank.com.br</b><span>↻</span></div>

<div class="flex justify-center gap-5 text-[14px] text-zinc-500 mt-1 font-medium">
<span id="t-daily" onclick="showTab('daily')" class="font-bold text-black border-b-2 border-black cursor-pointer">Daily</span>
<span id="t-cats" onclick="showTab('cats')" class="cursor-pointer">Categories</span>
<span>About</span>
</div>

<div class="flex justify-center mt-4"><div class="bg-white border rounded-full px-4 py-2 text-[13px]"><span class="text-green-600 font-bold">● <span id="online">24</span> online</span> · <span id="visitors">4,116</span> today</div></div>

<div id="dailyTab">
<div class="mt-6"><h1 class="font-black text-[30px]">Claim #1 for <span id="precoTop" class="text-[#E07A5F]">R$ 3.129</span></h1>
<input id="url" placeholder="Your product URL or @handle" class="w-full bg-white border rounded-full px-4 py-4 mt-3 text-[14px]">
<button onclick="claimTop()" class="w-full bg-[#E07A5F] text-white rounded-full py-4 font-black mt-3">Claim rank</button>
</div>
<div id="lista" class="mt-6 space-y-3"></div>
</div>

<div id="catsTab" class="hidden mt-6"></div>

</div>

<script>
let dadosTop = JSON.parse(localStorage.getItem('podio_top')||'null') || [
 {nome:"Além dos Versículos - 355K",link:"https://www.facebook.com/share/1C9k3ZA1pG/",valor:3129,icon:"📖"},
 {nome:"Rupert Marketing - 48K",link:"https://www.facebook.com/share/19T6y57XuF/",valor:2399,icon:"🚀"},
 {nome:"PEDRO Automação - YouTube",link:"https://youtube.com/@meme-zinho?si=VnRDBaijlDCtGv0e",valor:1299,icon:"🤖"},
];

function priceFor(pos){
 if(pos==1) return 3129;
 if(pos==2) return 2399;
 if(pos==3) return 1299;
 if(pos==4) return 999;
 if(pos==5) return 799;
 if(pos==6) return 599;
 if(pos==7) return 499;
 if(pos==8) return 399;
 if(pos==9) return 299;
 if(pos==10) return 199;
 if(pos<=15) return 149 - (pos-10)*10;
 if(pos<=20) return 99 - (pos-15)*5;
 if(pos<=30) return 79 - (pos-20)*2;
 if(pos<=50) return 59 - (pos-30);
 if(pos<=100) return 39 - Math.floor((pos-50)*0.5);
 return Math.max(1, 20 - Math.floor((pos-100)/10));
}

function renderTop(){
 dadosTop.sort((a,b)=>b.valor-a.valor);
 localStorage.setItem('podio_top',JSON.stringify(dadosTop));
 document.getElementById('precoTop').innerText='R$ '+(dadosTop[0].valor+1);
 let html='';
 dadosTop.forEach((t,i)=>{
  html+=`<div class="card rounded-[20px] p-4 flex gap-3"><div class="w-12 h-12 bg-black text-white rounded-[14px] flex items-center justify-center font-black">#${i+1}</div><div class="flex-1"><p class="font-black text-[14px]"><span class="text-[#E07A5F]">#${i+1}</span> ${t.nome}</p><p class="text-[11px] text-zinc-500">${t.link}</p></div><b class="text-[#E07A5F]">R$ ${t.valor}</b></div>
  <button onclick="tomarTop(${i})" class="w-full bg-black text-white rounded-full py-2 text-[11px] font-black mb-3">TOMAR #${i+1} por R$ ${t.valor+1} →</button>`;
 });
 for(let i=dadosTop.length+1;i<=10;i++){
  html+=`<div class="card rounded-[20px] p-4 flex gap-3 mb-3 opacity-60"><div class="w-12 h-12 bg-zinc-200 rounded-[14px] flex items-center justify-center font-black">#${i}</div><div class="flex-1"><p class="font-black">VAGA LIVRE #${i}</p><p class="text-[11px]">R$ ${priceFor(i)}</p></div></div>`;
 }
 document.getElementById('lista').innerHTML=html;
}

function claimTop(){
 let link=document.getElementById('url').value; if(!link.startsWith('http')){alert('Cole https://');return;}
 let nome=prompt('Seu nome:')||'Você'; let valor=dadosTop[0].valor+1;
 dadosTop.unshift({nome,link,valor,icon:"🔥"}); renderTop();
}
function tomarTop(i){ let t=dadosTop[i]; let nome=prompt('Seu nome pra tomar #'+(i+1))||'Você'; let link=document.getElementById('url').value||t.link; dadosTop.unshift({nome,link,valor:t.valor+1,icon:"🔥"}); renderTop(); }

// CATEGORIAS COM 150 CADA
const CATEGORIAS=["📈 MARKETING","⚖️ ADVOGADOS","🩺 MÉDICOS","🛒 MERCADO","📦 ECOM","▶️ YOUTUBE","📘 FACEBOOK","📸 INSTAGRAM","🐦 X / TWITTER","🎨 DESIGN","💰 FINANÇAS","🔍 SEO","🎯 TRÁFEGO","📚 INFOPRODUTO","💎 PLR"];
let catsData = JSON.parse(localStorage.getItem('podio_cats')||'null') || {};
CATEGORIAS.forEach(c=>{ if(!catsData[c]) catsData[c]=[]; });

function renderCats(){
 let html='';
 CATEGORIAS.forEach((cat,idx)=>{
  let lista=catsData[cat];
  lista.sort((a,b)=>b.valor-a.valor);
  let vagasHtml='';
  // mostra ocupadas
  lista.forEach((t,i)=>{
   vagasHtml+=`<div class="bg-[#FFF1E8] rounded-full px-3 py-2 mb-2 flex justify-between text-[11px]"><span><b>#${i+1}</b> ${t.nome} - R$ ${t.valor}</span><a href="${t.link}" target="_blank" class="underline">ver</a></div>`;
  });
  // completa até 150 com funil
  for(let p=lista.length+1;p<=150;p++){
   let pr=priceFor(p);
   vagasHtml+=`<div class="bg-white border rounded-full px-3 py-2 mb-2 flex justify-between items-center text-[11px]"><span><b>#${p}</b> VAGA LIVRE - R$ ${pr}</span><button onclick="pegarCat('${cat}',${p})" class="bg-black text-white px-3 py-1 rounded-full font-bold">PEGAR</button></div>`;
  }
  html+=`<div class="bg-white border rounded-[20px] p-4 mb-4">
  <div class="flex justify-between items-center"><p class="font-black">${cat}</p><span class="bg-black text-white text-[10px] px-2 py-1 rounded-full">150 VAGAS • R$ ${priceFor(1)} a R$ 1</span></div>
  <div class="mt-3 max-h-[300px] overflow-y-auto pr-1" id="cat-${idx}">${vagasHtml}</div>
  <button onclick="document.getElementById('cat-${idx}').classList.toggle('max-h-[300px]')" class="w-full bg-zinc-100 rounded-full py-2 text-[11px] font-bold mt-2">Ver 1 ao 150 ↓↑</button>
  </div>`;
 });
 document.getElementById('catsTab').innerHTML=html;
}

function pegarCat(cat,pos){
 let link=document.getElementById('url').value; if(!link){alert('Cole seu link no topo primeiro (Daily)'); showTab('daily'); return;}
 let nome=prompt(`Seu nome pra #${pos} em ${cat}:`)||'Você';
 let valor=priceFor(pos);
 // se já tem gente, tem que cobrir
 let lista=catsData[cat];
 if(lista.length>=pos && lista[pos-1] && valor <= lista[pos-1].valor){ valor=lista[pos-1].valor+1; }
 catsData[cat].push({nome,link,valor,pos});
 localStorage.setItem('podio_cats',JSON.stringify(catsData));
 renderCats();
 alert(`Pegou #${pos} em ${cat} por R$ ${valor}! Agora só sai se pagarem R$ ${valor+1}`);
}

function showTab(t){
 if(t=='daily'){document.getElementById('dailyTab').classList.remove('hidden');document.getElementById('catsTab').classList.add('hidden');document.getElementById('t-daily').classList.add('border-b-2','border-black');document.getElementById('t-cats').classList.remove('border-b-2','border-black');}
 else{document.getElementById('dailyTab').classList.add('hidden');document.getElementById('catsTab').classList.remove('hidden');document.getElementById('t-cats').classList.add('border-b-2','border-black');document.getElementById('t-daily').classList.remove('border-b-2','border-black');renderCats();}
}

let on=24; setInterval(()=>{on+=Math.floor(Math.random()*3)-1; document.getElementById('online').innerText=on;},3000);
let vis=parseInt(localStorage.getItem('vis')||'4116'); setInterval(()=>{vis++; localStorage.setItem('vis',vis); document.getElementById('visitors').innerText=vis;},5000);
document.getElementById('visitors').innerText=vis;

renderTop();
renderCats();
</script>
</body>
</html>
