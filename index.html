<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podio Rank - Quem paga mais fica no topo</title>
<style>
body{font-family:Inter,sans-serif;background:#f8f9fa;margin:0;padding:20px}
.cat-bar{display:flex;gap:8px;overflow-x:auto;justify-content:flex-start;padding:10px 0 20px 0;flex-wrap:nowrap; -webkit-overflow-scrolling: touch;}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{padding:10px 16px;border-radius:999px;border:1px solid #ddd;background:white;white-space:nowrap;font-weight:800;cursor:pointer;font-size:12px}
.cat-btn.active{background:black;color:white;border-color:black}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.pos{font-size:28px;font-weight:900}
.btn{padding:10px 18px;border-radius:10px;background:black;color:white;border:0;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<h1 style="text-align:center;font-weight:900;margin:0">PODIO RANK</h1>
<p style="text-align:center;color:#666;margin-top:6px">Quem paga mais, fica no topo.</p>

<div class="cat-bar" id="catBar">
  <button onclick="trocarCat('marketing')" id="cat-marketing" class="cat-btn active">📈 MARKETING</button>
  <button onclick="trocarCat('advogados')" id="cat-advogados" class="cat-btn">⚖️ ADVOGADOS</button>
  <button onclick="trocarCat('medicos')" id="cat-medicos" class="cat-btn">🩺 MÉDICOS</button>
  <button onclick="trocarCat('dentistas')" id="cat-dentistas" class="cat-btn">🦷 DENTISTAS</button>
  <button onclick="trocarCat('clinicas')" id="cat-clinicas" class="cat-btn">🏥 CLÍNICAS / ESTÉTICA</button>
  <button onclick="trocarCat('academias')" id="cat-academias" class="cat-btn">🏋️ ACADEMIAS</button>
  <button onclick="trocarCat('empresarios')" id="cat-empresarios" class="cat-btn">💼 EMPRESÁRIOS</button>
  <button onclick="trocarCat('infoprodutos')" id="cat-infoprodutos" class="cat-btn">🚀 INFOPRODUTOS</button>
  <button onclick="trocarCat('sites')" id="cat-sites" class="cat-btn">🌐 SITES GRANDES</button>
  <button onclick="trocarCat('youtube')" id="cat-youtube" class="cat-btn">▶️ YOUTUBE</button>
  <button onclick="trocarCat('x')" id="cat-x" class="cat-btn">𝕏 X / TWITTER</button>
  <button onclick="trocarCat('instagram')" id="cat-instagram" class="cat-btn">📸 INSTAGRAM</button>
</div>

<div style="text-align:center;margin-bottom:15px;font-weight:800">Volume: R$ <span id="volume">0,00</span></div>

<div id="lista"></div>

<script>
let categoriaAtual = 'marketing';

function trocarCat(cat){
  categoriaAtual = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('cat-'+cat).classList.add('active');
  carregar();
}

async function carregar(){
  const res = await fetch('/api/ranking?cat='+categoriaAtual);
  const rank = await res.json();
  let html = '';
  let volume = 0;
  for(let i=1;i<=10;i++){
    const r = rank[i] || {preco: (30*Math.pow(1.3,10-i)), nome:null};
    volume += r.preco;
    const livre =!r.nome;
    html += `<div class="card">
      <div><div class="pos">#${i}</div><div style="font-weight:800">${r.nome || 'LIVRE'} - R$ ${r.preco.toFixed(2).replace('.',',')}</div></div>
      <button class="btn" onclick="comprar(${i})">${livre? 'COMPRAR' : 'TOMAR'}</button>
    </div>`;
  }
  document.getElementById('lista').innerHTML = html;
  document.getElementById('volume').innerText = volume.toFixed(2).replace('.',',');
}

async function comprar(pos){
  const nome = prompt('Nome do seu site/canal?');
  if(!nome) return;
  const url = prompt('Link (https://...)');
  if(!url) return;
  const res = await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pos,nome,url,cat:categoriaAtual})});
  const data = await res.json();
  window.location.href = data.url;
}

// pega cat da url se voltou do MP
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('cat')) trocarCat(urlParams.get('cat'));
else carregar();
</script>
</body>
</html>
