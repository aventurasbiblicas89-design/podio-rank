<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podio Rank - Leilão de visibilidade</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#fefaf8;margin:0;padding:16px;color:#1a1a1a}
.top{max-width:700px;margin:0 auto}
.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 0 14px 0;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{padding:10px 14px;border-radius:999px;border:1px solid #e5e7eb;background:white;white-space:nowrap;font-weight:800;cursor:pointer;font-size:11px}
.cat-btn.active{background:#ff5a2c;color:white;border-color:#ff5a2c}
.stats-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 18px 0}
.pill{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.dot{width:10px;height:10px;background:#00c950;border-radius:50%;display:inline-block}
.toggle{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:5px;display:flex;gap:4px}
.toggle button{border:0;border-radius:999px;padding:7px 16px;font-weight:800;font-size:13px;cursor:pointer}
.toggle button.active{background:#ff5a2c;color:white}
.claim-box{max-width:700px;margin:0 auto 20px auto;background:white;border-radius:20px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.claim-price{font-size:28px;font-weight:900;text-align:center;margin:6px 0}
.claim-price span{color:#ff5a2c}
.auction-banner{background:#fef3c7;border:1px solid #fbbf24;padding:10px;text-align:center;border-radius:12px;margin:12px 0;font-weight:800;font-size:13px}
.input{width:100%;box-sizing:border-box;padding:16px 18px;border-radius:999px;border:1px solid #e5e7eb;font-size:16px;outline:none}
.btn-claim{width:100%;padding:16px;border-radius:999px;border:0;background:#ff5a2c;color:white;font-weight:900;font-size:18px;margin-top:12px;cursor:pointer}
.card{background:white;border-radius:20px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.pos{font-weight:900;font-size:14px;color:#ff5a2c}
.clicks{font-size:11px;color:#666}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0"><div style="font-weight:900;font-size:22px">⚡ Podio Rank</div><div style="font-size:12px;color:#666">podiorank.com.br</div></div>
<div class="cat-bar">
<button onclick="trocarCat('marketing')" id="cat-marketing" class="cat-btn active">📈 MARKETING</button>
<button onclick="trocarCat('advogados')" id="cat-advogados" class="cat-btn">⚖️ ADVOGADOS</button>
<button onclick="trocarCat('medicos')" id="cat-medicos" class="cat-btn">🩺 MÉDICOS</button>
<button onclick="trocarCat('dentistas')" id="cat-dentistas" class="cat-btn">🦷 DENTISTAS</button>
<button onclick="trocarCat('clinicas')" id="cat-clinicas" class="cat-btn">🏥 CLÍNICAS</button>
<button onclick="trocarCat('academias')" id="cat-academias" class="cat-btn">🏋️ ACADEMIAS</button>
<button onclick="trocarCat('empresarios')" id="cat-empresarios" class="cat-btn">💼 EMPRESÁRIOS</button>
<button onclick="trocarCat('infoprodutos')" id="cat-infoprodutos" class="cat-btn">🚀 INFOPRODUTOS</button>
<button onclick="trocarCat('sites')" id="cat-sites" class="cat-btn">🌐 SITES</button>
<button onclick="trocarCat('youtube')" id="cat-youtube" class="cat-btn">▶️ YOUTUBE</button>
<button onclick="trocarCat('x')" id="cat-x" class="cat-btn">𝕏 X</button>
<button onclick="trocarCat('instagram')" id="cat-instagram" class="cat-btn">📸 INSTAGRAM</button>
<button onclick="trocarCat('tiktok')" id="cat-tiktok" class="cat-btn">🎵 TIKTOK</button>
</div>
<div class="stats-wrap"><div class="pill"><span class="dot"></span><span id="online">-- online</span> · <span id="visitors">-- visitors today</span> · <span onclick="abrirStats()" style="color:#666;cursor:pointer">stats→</span></div><div class="toggle"><button id="btn-alltime" class="active" onclick="setFiltro('all')">🏆 All-time</button><button id="btn-today" onclick="setFiltro('today')">🔴 Today</button></div></div>
<div class="claim-box">
<div class="auction-banner">🔥 LEILÃO AO VIVO - Fica 30 dias no topo ou até alguém pagar mais e tomar seu lugar</div>
<div class="claim-price">Seja #1 por <span id="priceTop">R$ --</span></div>
<input id="urlInput" class="input" placeholder="🌐 Cole seu link aqui (site, insta, youtube)">
<button class="btn-claim" onclick="claimTop()">DAR LANCE DE <span id="priceBtn">R$ --</span> →</button>
<div style="text-align:center;margin-top:10px;font-size:11px;color:#888">Garantido por 30 dias. Depois só sai se alguém pagar mais que você.</div>
<div style="text-align:center;margin-top:8px;font-size:12px;color:#666">Volume total: R$ <span id="volume">0,00</span></div>
</div>
<div id="lista"></div>
</div>
<script>
let categoriaAtual='marketing';let filtroAtual='all';let precoTopo=30;
function trocarCat(cat){categoriaAtual=cat;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));document.getElementById('cat-'+cat).classList.add('active');carregar();atualizarStats();}
function setFiltro(f){filtroAtual=f;document.getElementById('btn-alltime').className=f==='all'?'active':'';document.getElementById('btn-today').className=f==='today'?'active':'';carregar();}
async function carregar(){
let rank={};
try{
const res=await fetch('/api/ranking?cat='+categoriaAtual+'&filtro='+filtroAtual);
rank=await res.json();
}catch(e){rank={}}
if(categoriaAtual==='marketing' && (!rank[1] ||!rank[1].nome)){
  rank[1]={preco:211.02,nome:'Além dos Versículos - 355K',url:'https://www.facebook.com/share/1DZzBgZp5w/',clicks:355000};
  rank[2]={preco:162.33,nome:'Rupert - 48K',url:'https://www.facebook.com/share/1HkWdYy7Hf/',clicks:48000};
  rank[3]={preco:150.00,nome:'PEDRO - 1ª Venda ⭐',url:'#',clicks:89};
}
let html='';let volume=0;let precos=[];
for(let i=1;i<=10;i++){let precoBase=30*Math.pow(1.3,10-i);const r=rank[i]||{preco:precoBase,nome:null,url:null,clicks:0};precos.push(r.preco);volume+=r.preco;}
precoTopo=(precos[0]*1.3);document.getElementById('priceTop').innerText='R$ '+precoTopo.toFixed(2).replace('.',',');document.getElementById('priceBtn').innerText='R$ '+precoTopo.toFixed(2).replace('.',',');document.getElementById('volume').innerText=volume.toFixed(2).replace('.',',');
for(let i=1;i<=10;i++){
let precoBase=30*Math.pow(1.3,10-i);
const r=rank[i]||{preco:precoBase,nome:null,url:null,clicks:0};
const livre=!r.nome;
let linkUrl='#';if(r.url){linkUrl=r.url.startsWith('http')?r.url:'https://'+r.url;}
let nomeHtml=livre?'LIVRE - Clique para ocupar':'<a href="'+linkUrl+'" target="_blank" style="color:inherit;text-decoration:none">'+r.nome+'</a>';
let detalheHtml=livre?'R$ '+r.preco.toFixed(2).replace('.',',')+' · 30 dias ou até alguém tomar':'<span style="color:#666">R$ '+r.preco.toFixed(2).replace('.',',')+' · 30 dias ou até alguém tomar</span> · <a href="'+linkUrl+'" target="_blank" style="color:#ff5a2c;text-decoration:none;font-weight:700">ver →</a>';
html+='<div class="card"><div style="display:flex;gap:12px;align-items:center"><div style="width:44px;height:44px;background:#111;color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900">#'+i+'</div><div><div style="font-weight:900"><span class="pos">#'+i+'</span> '+nomeHtml+'</div><div class="clicks">'+detalheHtml+'</div></div></div><button onclick="comprar('+i+')" style="border:1px solid #ffd1c7;background:#fff1ed;color:#ff5a2c;padding:8px 14px;border-radius:999px;font-weight:800;cursor:pointer">'+(livre?'DAR LANCE':'TOMAR')+'</button></div>';
}
document.getElementById('lista').innerHTML=html;
}
async function comprar(pos){
  let url=document.getElementById('urlInput').value;
  if(!url) url=prompt('Link completo (https://...)');
  if(!url) return;
  let nome=prompt('Nome do seu site/canal/perfil?');
  if(!nome) return;
  try {
    const res=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pos,nome,url,cat:categoriaAtual})});
    const data=await res.json();
    const linkPagamento = data.url || data.init_point;
    if(linkPagamento){ window.location.href = linkPagamento; }
    else { alert('Erro checkout: ' + (data.error || JSON.stringify(data))); }
  } catch(e){ alert('Erro ao chamar checkout: ' + e.message); }
}
async function claimTop(){comprar(1);}
async function atualizarStats(){try{const r=await fetch('/api/stats?cat='+categoriaAtual);const s=await r.json();document.getElementById('online').innerText=s.online+' online';document.getElementById('visitors').innerText=s.visitorsToday.toLocaleString('pt-BR')+' visitors today';}catch(e){document.getElementById('online').innerText=(5+Math.floor(Math.random()*20))+' online';document.getElementById('visitors').innerText=(120+Math.floor(Math.random()*500))+' visitors today';}}
function abrirStats(){alert('📊 Podio Rank Stats\n\nCategoria: '+categoriaAtual.toUpperCase()+'\n'+document.getElementById('online').innerText+'\n'+document.getElementById('visitors').innerText);}
const urlParams=new URLSearchParams(window.location.search);if(urlParams.get('cat'))trocarCat(urlParams.get('cat'));else carregar();setInterval(atualizarStats,15000);atualizarStats();
</script>
</body>
</html>
