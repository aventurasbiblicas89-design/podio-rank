<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>podiorank.com.br</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#FFFBF7}
.main{max-width:620px;margin:0 auto;padding:20px}
h1{font-size:34px;font-weight:900;text-align:center}
.sub{text-align:center;color:#666;margin:8px 0 24px}
.box{background:#fff;border:1px solid #eee;border-radius:999px;padding:16px 20px;display:flex;gap:10px}
.box input{border:none;outline:none;width:100%;font-size:16px}
.btn{width:100%;background:#FF5A36;color:#fff;border:none;border-radius:999px;padding:18px;font-size:20px;font-weight:800;margin:16px 0}
.card{background:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.pag{display:flex;justify-content:center;margin-top:28px}
.pag span{background:#FF5A36;color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.counter{text-align:center;color:#999;margin-top:10px}
</style>
</head>
<body>
<div class="main">
<h1>Claim #1 por R$275</h1>
<div class="sub">Pódio Principal</div>
<div class="box">🌐 <input placeholder="Sua URL ou @handle"></div>
<button class="btn">Claim Rank</button>
<div class="card"><div><span style="color:#FF5A36;font-weight:800">#1</span> <b>Além dos Versículos</b></div><b>R$274</b></div>
<div class="card"><div><span style="color:#FF5A36;font-weight:800">#2</span> <b>Rupert</b></div><b>R$211</b></div>
<div class="card"><div><span style="color:#FF5A36;font-weight:800">#3</span> <b>Pedro</b></div><b>R$162</b></div>
<div class="pag"><span>1</span></div>
<div class="counter">1 - 3 of 3</div>
</div>
</body>
</html>
