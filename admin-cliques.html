<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achou Bom — Cliques</title>
<style>
  body{
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background:#F5F5F0; color:#22261F; margin:0; padding:24px;
  }
  .wrap{max-width:520px; margin:0 auto;}
  h1{font-size:1.3rem; margin-bottom:4px;}
  p.sub{opacity:.65; font-size:.9rem; margin-bottom:20px;}
  input{
    width:100%; padding:11px; border:1px solid #DCD8CC; border-radius:4px;
    font-size:1rem; margin-bottom:10px; box-sizing:border-box;
  }
  button{
    width:100%; padding:12px; border:none; border-radius:4px;
    background:#4B6455; color:#fff; font-size:.95rem; font-weight:600; cursor:pointer;
  }
  button:hover{background:#33473B;}
  table{width:100%; border-collapse:collapse; margin-top:22px;}
  th, td{text-align:left; padding:10px 8px; border-bottom:1px solid #DCD8CC; font-size:.92rem;}
  th{font-size:.78rem; text-transform:uppercase; opacity:.6;}
  .pos{font-weight:600; color:#4B6455;}
  #msg{font-size:.88rem; margin-top:10px;}
  #msg.erro{color:#B3402A;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ranking de cliques</h1>
  <p class="sub">Produtos mais clicados na vitrine Achou Bom</p>

  <input type="password" id="secret" placeholder="Senha de admin (ADMIN_SECRET)">
  <button onclick="carregar()">Ver ranking</button>
  <div id="msg"></div>

  <table id="tabela" style="display:none">
    <thead>
      <tr><th>#</th><th>Produto</th><th>Cliques</th></tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>
</div>

<script>
async function carregar() {
  const secret = document.getElementById('secret').value.trim();
  const msg = document.getElementById('msg');
  const tabela = document.getElementById('tabela');
  const corpo = document.getElementById('corpo');

  if (!secret) {
    msg.textContent = 'Digite a senha de admin.';
    msg.className = 'erro';
    return;
  }

  msg.textContent = 'Carregando...';
  msg.className = '';
  tabela.style.display = 'none';

  try {
    const res = await fetch('/api/click-stats?secret=' + encodeURIComponent(secret));
    if (!res.ok) {
      msg.textContent = 'Senha incorreta ou erro no servidor.';
      msg.className = 'erro';
      return;
    }
    const data = await res.json();
    const ranking = data.ranking || [];

    if (ranking.length === 0) {
      msg.textContent = 'Ainda não há cliques registrados.';
      msg.className = '';
      return;
    }

    corpo.innerHTML = '';
    ranking.forEach((item, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="pos">${i + 1}</td><td>${item.id}</td><td>${item.cliques}</td>`;
      corpo.appendChild(tr);
    });

    msg.textContent = '';
    tabela.style.display = 'table';
  } catch (err) {
    msg.textContent = 'Erro ao conectar com o servidor.';
    msg.className = 'erro';
  }
}
</script>
</body>
</html>
